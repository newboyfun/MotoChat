<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoChat 登录</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
  <script src="/static/theme.js"></script>
  <style>
    .login-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0a0a12; position: relative; overflow: hidden;
    }
    /* AI 生成主视觉背景 */
    .login-bg { position: absolute; inset: 0; pointer-events: none; }
    .login-bg::before {
      content: ''; position: absolute; inset: 0;
      background: url('/static/assets/login-hero.jpg') center / cover no-repeat;
      animation: heroDrift 24s ease-in-out infinite alternate;
    }
    @keyframes heroDrift {
      from { transform: scale(1.02) translate(0, 0); }
      to { transform: scale(1.1) translate(-1.5%, 1.5%); }
    }
    .login-bg::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 90% 70% at 50% 45%, transparent 30%, rgba(6, 6, 14, 0.72) 100%),
                  linear-gradient(180deg, rgba(6, 6, 14, 0.25), rgba(6, 6, 14, 0.55));
    }

    .login-wrapper {
      position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 24px;
      animation: loginEnter 0.8s cubic-bezier(0.19, 1, 0.22, 1);
    }
    @keyframes loginEnter { from { opacity: 0; transform: translateY(30px) scale(0.97); } }

    .login-card {
      background: rgba(16, 16, 28, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      border-radius: var(--r-xl); padding: 44px 36px 36px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    }

    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .logo-icon {
      width: 72px; height: 72px; margin: 0 auto 18px;
      border-radius: 50%; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.15);
      animation: logoFloat 5s ease-in-out infinite;
    }
    .login-logo .logo-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .login-logo h1 {
      font-size: 27px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.4px;
      color: #f2f2f8;
    }
    .login-logo p { font-size: 14px; color: rgba(228, 228, 240, 0.66); }

    .login-divider {
      display: flex; align-items: center; gap: 14px; margin: 28px 0;
      color: rgba(228, 228, 240, 0.4); font-size: 11px;
      text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);
    }

    .login-form .form-group { margin-bottom: 20px; }
    .login-form .form-group label {
      display: block; margin-bottom: 7px; font-size: 11px;
      font-weight: 600; color: rgba(228, 228, 240, 0.55);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .login-form .form-input {
      width: 100%; padding: 13px 16px;
      background: rgba(10, 10, 20, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--r-sm);
      color: #ececf4; font-size: 14px; font-family: var(--font);
      transition: all var(--transition);
    }
    .login-form .form-input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(10, 10, 20, 0.7);
    }
    .login-form .form-input::placeholder { color: rgba(228, 228, 240, 0.3); }

    .login-btn {
      width: 100%; justify-content: center; padding: 13px 0; font-size: 14px;
      position: relative; overflow: hidden;
    }
    .login-btn .btn-spinner {
      display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    .login-btn.loading .btn-text { display: none; }
    .login-btn.loading .btn-spinner { display: block; }
    .login-btn.loading { pointer-events: none; opacity: 0.8; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-error {
      font-size: 12px; color: #f87171; margin-top: 14px; text-align: center;
      min-height: 18px; font-weight: 500; transition: all 0.2s;
    }

    .login-footer {
      text-align: center; margin-top: 32px;
      display: flex; align-items: center; justify-content: center; gap: 16px;
    }
    .login-footer span { width: 3px; height: 3px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }
    .login-footer a { color: var(--accent-light); text-decoration: none; font-weight: 600; font-size: 12px; transition: opacity 0.2s; }
    .login-footer a:hover { opacity: 0.7; }

    @media (prefers-reduced-motion: reduce) {
      .login-bg::before, .login-logo .logo-icon { animation: none !important; }
      .login-wrapper { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>

    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-logo">
          <div class="logo-icon">
            <img src="/static/assets/avatar-default.jpg" alt="MotoChat">
          </div>
          <h1>MotoChat</h1>
          <p>本地 AI 角色聊天平台</p>
        </div>

        <div class="login-divider">账号登录</div>

        <div class="login-form">
          <div class="form-group">
            <label>账号</label>
            <input id="authUser" class="form-input" placeholder="请输入账号" autocomplete="username" autofocus>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input id="authPass" type="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
          </div>
          <div class="auth-actions">
            <button class="btn btn-primary login-btn" id="authLoginBtn">
              <span class="btn-text">登录</span>
              <span class="btn-spinner"></span>
            </button>
          </div>
          <div class="login-error" id="authError"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/login.js?v=4"></script>
</body>
</html>
