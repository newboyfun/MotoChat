<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoChat 管理 - 用户管理</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div id="app">
    <div class="auth-wrapper" id="authView" style="display:none">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a4 4 0 014 4c0 2.2-1.8 4-4 4m0 0a4 4 0 01-4-4c0-2.2 1.8-4 4-4m0 0v2m0 2v12m-4-2l4 2 4-2"/>
              <circle cx="12" cy="6" r="1.5"/>
              <circle cx="10" cy="17" r="1" opacity="0.6"/>
              <circle cx="14" cy="17" r="1" opacity="0.6"/>
              <circle cx="12" cy="20" r="1" opacity="0.3"/>
            </svg>
          </div>
          <h2>MotoChat 管理后台</h2>
          <p>请使用管理员账号登录</p>
        </div>
        <div class="form-group"><label>账号</label><input id="authUser" class="form-input" placeholder="请输入管理员账号"></div>
        <div class="form-group"><label>密码</label><input id="authPass" type="password" class="form-input" placeholder="请输入密码"></div>
        <div class="auth-actions"><button class="btn btn-primary" id="authLoginBtn">登录</button></div>
        <div id="authError" class="cfg-status error" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="layout" id="layout" style="display:none">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a4 4 0 014 4c0 2.2-1.8 4-4 4m0 0a4 4 0 01-4-4c0-2.2 1.8-4 4-4m0 0v2m0 2v12m-4-2l4 2 4-2"/>
              <circle cx="12" cy="6" r="1.5"/>
              <circle cx="10" cy="17" r="1" opacity="0.6"/>
              <circle cx="14" cy="17" r="1" opacity="0.6"/>
              <circle cx="12" cy="20" r="1" opacity="0.3"/>
            </svg>
          </div>
          <span class="brand-name">MotoChat</span>
        </div>
        <nav class="nav">
          <a class="nav-btn" href="/admin">← 返回管理台</a>
          <a class="nav-btn active" href="/admin/users">用户管理</a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button class="btn-icon" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <h2>用户管理</h2>
          </div>
          <div class="topbar-right">
            <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="(window.mcTheme||{}).toggle?window.mcTheme.toggle():null;var d=document.documentElement.hasAttribute('data-theme');var s=document.getElementById('themeIconSun');var m=document.getElementById('themeIconMoon');if(s)s.style.display=d?'none':'';if(m)m.style.display=d?'':''">
              <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            </button>
            <button class="btn" id="logoutBtn" style="display:none">退出</button>
          </div>
        </header>
        <section class="page active" style="padding:20px">
          <div class="dash-card">
            <h3>用户列表 <button class="btn btn-primary" id="addUserBtn" style="float:right">新增用户</button></h3>
            <div id="usersList"><div class="loading-text">加载中…</div></div>
          </div>
          <div class="dash-card" id="addCard" style="display:none;margin-top:16px">
            <h3>新增用户</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
              <div class="form-group"><label>用户名</label><input id="nuUsername" class="form-input"></div>
              <div class="form-group"><label>密码</label><input id="nuPassword" class="form-input" type="password"></div>
              <div class="form-group"><label>默认角色</label><input id="nuPersona" class="form-input" value="MONO"></div>
            </div>
            <button class="btn btn-primary" id="createUserBtn">创建</button>
            <span id="nuStatus" class="cfg-status"></span>
          </div>
          <div class="dash-card" id="memoryCard" style="display:none;margin-top:16px">
            <h3 id="memoryTitle">用户记忆</h3>
            <div id="memoryList" style="max-height:360px;overflow:auto;font-size:13px;line-height:1.8"></div>
          </div>
          <div class="dash-card" id="messagesCard" style="display:none;margin-top:16px">
            <h3 id="messagesTitle">用户消息</h3>
            <div id="messagesList" style="max-height:420px;overflow:auto;font-size:13px;line-height:1.8"></div>
          </div>
          <div class="dash-card" id="editCard" style="display:none;margin-top:16px">
            <h3 id="editTitle">编辑用户</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div class="form-group"><label>用户名</label><input id="euUsername" class="form-input" disabled></div>
              <div class="form-group"><label>当前角色</label><input id="euPersona" class="form-input"></div>
              <div class="form-group"><label>新密码（留空不改）</label><input id="euPassword" class="form-input" type="password"></div>
              <div class="form-group"><label>独立 API Key（留空用全局）</label><input id="euApiKey" class="form-input" type="password"></div>
              <div class="form-group"><label>独立 Base URL</label><input id="euBaseUrl" class="form-input"></div>
              <div class="form-group"><label>独立 Model</label><input id="euModel" class="form-input"></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              <button class="btn btn-primary" id="saveUserBtn">保存用户配置</button>
              <button class="btn" id="resetPwBtn">重置密码</button>
              <button class="btn" id="setPersonaBtn">设为默认角色</button>
              <button class="btn" id="viewMessagesBtn">查看消息</button>
            </div>
            <span id="euStatus" class="cfg-status"></span>
          </div>
          <div class="dash-card" id="personaCard" style="display:none;margin-top:16px">
            <h3 id="personaTitle">角色覆盖</h3>
            <div class="form-group"><label>角色名称</label><input id="epPersonaName" class="form-input" placeholder="MONO"></div>
            <div class="form-group"><label>用户覆盖内容</label><textarea id="epContent" class="form-input" rows="8"></textarea></div>
            <div style="display:flex;gap:8px">
              <button class="btn" id="loadBaseBtn">读取默认</button>
              <button class="btn btn-primary" id="savePersonaBtn">保存覆盖</button>
              <button class="btn" id="clearPersonaBtn">清空覆盖</button>
            </div>
            <span id="epStatus" class="cfg-status"></span>
          </div>
        </section>
      </main>
    </div>
    <div id="toasts"></div>
  </div>
  <script src="/static/admin-users.js?v=3"></script>
  <script>
    (function(){var d=document.documentElement.hasAttribute('data-theme');var s=document.getElementById('themeIconSun');var m=document.getElementById('themeIconMoon');if(s)s.style.display=d?'none':'';if(m)m.style.display=d?'':''})();
  </script>
</body>
</html>
